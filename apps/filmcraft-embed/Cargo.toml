[package]
name = "filmcraft-embed"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "FilmCraft as a library Workbench hosts natively in its side panel (craft-embed)"
publish = false

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
filmcraft-engine = { workspace = true }
filmcraft-ui-egui = { workspace = true }
filmcraft-platform = { workspace = true }
egui = { workspace = true }
# The desktop app's `eframe::App` impl is what this drives; `wgpu` for `Frame::wgpu_render_state`.
eframe = { workspace = true, features = ["wgpu"] }
serde_json = { workspace = true }
craft-embed = { path = "../../../../crates/craft-embed" }
